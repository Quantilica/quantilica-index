# Fatos do ecossistema sobre cada fetcher: onde ele aparece e como.
#
# Uma seção por id (o `id` do `FetcherInfo`, não a distribuição). Este arquivo é
# a terceira camada do registro público: a identidade do pacote (distribuição,
# módulo, repositório, versão) vem dos metadados do pacote instalado e os fatos
# da fonte vêm do `FetcherInfo`; aqui só entra o que nenhum dos dois sabe.
# `scripts/build_registry.py` o junta ao export e publica `registry.json`.
#
#   docs_pasta     seção de `docs/docs/fontes/` (vocabulário `DOCS_PASTAS`, no core)
#   vitrine        tem cartão no site
#   ci_integracao  entra no CI de integração do core
#   json_leve      série JSON leve da auditoria (isenta de lake Hive)
#   mascote        id da fonte dona da imagem do mascote
#   health_url     sonda do `quantilica health`
#   historico      nomes anteriores (renomes): distribution, repo, id e data
#
# Fetcher novo: acrescente a seção. Renome: mantenha a seção do id novo e
# acrescente a entrada em `historico` (o índice continua servindo o nome antigo).

